<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nossa Finança</title>
  <meta name="description" content="Gestão financeira da família: lançamentos, contas fixas, cartões, metas e projeções.">
  <meta name="theme-color" content="#2d9cdb">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="busy" class="busy" aria-hidden="true"></div>

  <!-- Tela de conexão (primeiro acesso) -->
  <section id="connect" class="connect" hidden><div id="connect-card" class="connect-card"></div></section>

  <!-- Aplicativo -->
  <div id="app" class="app" hidden>
    <aside id="side" class="side" aria-label="Menu principal">
      <div class="side-top">
        <div class="brand"><span class="brand-mark" aria-hidden="true"><span></span></span><span class="brand-name">Nossa Finança</span></div>
        <button id="side-toggle" class="btn-icon side-toggle" type="button" aria-expanded="false" aria-label="Expandir menu"></button>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="side-foot">
        <button id="sync-btn" class="nav-i" type="button" title="Sincronizar agora"></button>
      </div>
    </aside>
    <div id="side-backdrop" class="side-backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button id="menu-btn" class="btn-icon menu-btn" type="button" aria-label="Abrir menu"></button>
        <h1 id="page-title" class="page-title">Painel</h1>
        <div class="top-tools">
          <div id="scope" class="seg seg-scope" role="radiogroup" aria-label="Quem ver"></div>
          <div id="month-nav" class="month-nav" hidden>
            <button id="m-prev" class="btn-icon sm" type="button" aria-label="Mês anterior"></button>
            <button id="m-label" class="m-label" type="button" title="Voltar para o mês atual"></button>
            <button id="m-next" class="btn-icon sm" type="button" aria-label="Próximo mês"></button>
          </div>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <!-- Botão de ação rápida: expande em bolhas -->
    <div id="fab" class="fab">
      <div class="fab-menu" id="fab-menu" hidden>
        <button type="button" class="fab-i" data-act="tx"><span class="fab-t">Novo lançamento</span><span class="fab-b" data-ic="plus"></span></button>
        <button type="button" class="fab-i" data-act="paste"><span class="fab-t">Colar notificação</span><span class="fab-b" data-ic="paste"></span></button>
        <button type="button" class="fab-i" data-act="payslip"><span class="fab-t">Ler contracheque</span><span class="fab-b" data-ic="doc"></span></button>
      </div>
      <button id="fab-btn" class="fab-btn" type="button" aria-expanded="false" aria-label="Ações rápidas"></button>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <noscript>Este aplicativo precisa de JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
